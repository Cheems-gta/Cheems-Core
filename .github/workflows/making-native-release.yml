name: Build and publish Making standalone native engine
on:
  push:
    branches: [making-latest]
    paths:
      - 'native/quic/**'
      - 'app/src/main/java/win/**'
      - 'integration/**'
      - '.github/workflows/making-native-release.yml'
      - 'MAKING.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Making source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - name: Apply Making integration source patch
        run: |
          # The pinned transport-preview tree already exists in this branch.
          # Retain the Doreena patch's verified path references without
          # depending on cloning another repository at build time.
          mkdir -p core-upstream
          ln -s "$GITHUB_WORKSPACE/native" core-upstream/native
          python3 integration/patch_making_timeout.py
      - name: Test patched native transport
        working-directory: native/quic
        run: |
          go mod verify
          go test ./... -count=1 -timeout=90s
          go vet ./...
      - name: Install gomobile and Go bindings
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Making Android AAR
        working-directory: native/quic
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          gomobile init
          gomobile bind -ldflags='-extldflags=-Wl,-z,max-page-size=16384,-z,common-page-size=16384' -target=android/arm,android/arm64 -javapkg go -androidapi 28 -o making-android.aar ./mobilebridge
          unzip -p making-android.aar classes.jar > /tmp/making-bridge.jar
          javap -classpath /tmp/making-bridge.jar go.mobilebridge.Mobilebridge > /tmp/making-api.txt
          grep -q "startTunnel" /tmp/making-api.txt
          grep -q "probeHysteria2WithNetwork" /tmp/making-api.txt
          grep -q "probeAnyTLSWithNetwork" /tmp/making-api.txt
          unzip -p making-android.aar jni/arm64-v8a/libgojni.so > /tmp/making-arm64.so
          test -s /tmp/making-arm64.so
      - name: Package patched source and binary
        run: |
          mkdir -p dist
          cp native/quic/making-android.aar dist/Making-android.aar
          # This source archive contains the *post-patch* engine sources,
          # unlike an unpatched GitHub auto-generated tag source archive.
          tar -czf dist/Making-patched-source.tar.gz \
            native/quic app/src/main/java/win integration \
            COPYING THIRD_PARTY_NOTICES.md MAKING.md
          (cd dist && sha256sum Making-android.aar Making-patched-source.tar.gz > SHA256SUMS.txt)
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Making-standalone-android-native
          path: dist/*
          if-no-files-found: error
      - name: Publish tagged Making preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="making-native-${GITHUB_SHA:0:8}"
          gh release create "$tag" dist/Making-android.aar dist/Making-patched-source.tar.gz dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Making native core preview (${GITHUB_SHA:0:8})" \
            --notes "Standalone Android native AAR + post-patch source archive from the Making integration code used by Doreena. Go tests and Java binding checks passed in CI. Real-device networking, TUN disconnect, and protocol latency require device verification. Historical COPYING is GPL-3.0; verify contributor and dependency licensing before downstream redistribution. Some compatibility paths bypass TLS certificate validation."
