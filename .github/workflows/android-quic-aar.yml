name: Build Android QUIC AAR
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/quic/**'
      - 'app/**'
      - '.github/workflows/android-quic-aar.yml'
jobs:
  android-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: native/quic/go.mod
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Hysteria 2 Android library
        working-directory: native/quic
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          go test ./... -count=1
          go vet ./...
          gomobile init
          gomobile bind -target=android/arm,android/arm64 -javapkg go -androidapi 28 -o cheems-quic.aar ./mobilebridge
      - name: Package native AAR into Android APK
        run: |
          mkdir -p app/libs
          cp native/quic/cheems-quic.aar app/libs/
          unzip -p app/libs/cheems-quic.aar classes.jar > /tmp/cheems-bindings.jar
          echo "Generated gomobile Java classes:"
          jar tf /tmp/cheems-bindings.jar | grep -E "\\.class$" | head -80
          jar tf /tmp/cheems-bindings.jar | grep -Fx "go/mobilebridge/Mobilebridge.class"
          javap -classpath /tmp/cheems-bindings.jar go.mobilebridge.Mobilebridge > /tmp/cheems-native-api.txt
          grep -Eq 'start\(java.lang.String, long, java.lang.String, java.lang.String, long\)' /tmp/cheems-native-api.txt
          grep -Eq 'isRunning\(\)' /tmp/cheems-native-api.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          s=s.replace('dependencies {', 'dependencies {\n implementation files("libs/cheems-quic.aar")', 1)
          p.write_text(s)
          PY
          gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx "lib/arm64-v8a/libgojni.so"
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx "lib/armeabi-v7a/libgojni.so"
      - uses: actions/upload-artifact@v4
        with:
          name: cheems-quic-integrated-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cheems-quic-android-aar
          path: |
            native/quic/cheems-quic.aar
            native/quic/cheems-quic-sources.jar
          if-no-files-found: error
