name: Build Android QUIC AAR
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/quic/**'
      - '.github/workflows/android-quic-aar.yml'
jobs:
  android-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: native/quic/go.mod
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Hysteria 2 Android library
        working-directory: native/quic
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          go mod tidy
          gomobile init
          gomobile bind -target=android -androidapi 28 -o cheems-quic.aar ./mobilebridge
      - uses: actions/upload-artifact@v4
        with:
          name: cheems-quic-android-aar
          path: |
            native/quic/cheems-quic.aar
            native/quic/cheems-quic-sources.jar
          if-no-files-found: error
