name: Validate Cheems Core Android VPN source (no APK artifact)
on:
  push:
    branches: [compatibility]
    paths:
      - 'native/quic/**'
      - 'app/**'
      - 'gradle.properties'
      - '.github/workflows/android-vpn-checks.yml'
  pull_request:
    branches: [compatibility]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-vpn-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: native/quic/go.mod
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install gomobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check Go transport and tunnel
        working-directory: native/quic
        run: |
          go mod tidy
          go mod verify
          go test ./... -race -count=1 -timeout=90s
          go vet ./...
      - name: Build Android native binding
        working-directory: native/quic
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          gomobile init
          gomobile bind -ldflags='-extldflags=-Wl,-z,max-page-size=16384,-z,common-page-size=16384' -target=android/arm,android/arm64 -javapkg go -androidapi 28 -o cheems-quic.aar ./mobilebridge
          unzip -p cheems-quic.aar classes.jar > /tmp/cheems-bindings.jar
          javap -classpath /tmp/cheems-bindings.jar go.mobilebridge.Mobilebridge > /tmp/cheems-native-api.txt
          grep -Eq 'startWithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, long, java.lang.String, boolean, java.lang.String, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'startAnyTLSWithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, long, java.lang.String, boolean, java.lang.String, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'startVLESSWithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, long, java.lang.String, boolean, java.lang.String, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'startSOCKS5WithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, long, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'startVMessWithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, java.lang.String, long, boolean, long, java.lang.String, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'startShadowsocks2022WithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, long, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'startTUICWithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, java.lang.String, java.lang.String, java.lang.String, boolean, long, java.lang.String, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'startVLESSWebSocketWithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, long, java.lang.String, boolean, java.lang.String, java.lang.String, java.lang.String, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'startVLESSGRPCWithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, long, java.lang.String, boolean, java.lang.String, java.lang.String, java.lang.String, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'startVMessWebSocketWithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, java.lang.String, long, boolean, long, java.lang.String, java.lang.String, java.lang.String, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'startVMessGRPCWithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, java.lang.String, long, boolean, long, java.lang.String, java.lang.String, java.lang.String, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'startVLESSRealityWithNetwork\(java.lang.String, long, java.lang.String, java.lang.String, java.lang.String, java.lang.String, java.lang.String, long, java.lang.String, go.mobilebridge.Network\)' /tmp/cheems-native-api.txt
          grep -Eq 'tunnelUploaded\(\)' /tmp/cheems-native-api.txt
          grep -Eq 'tunnelDownloaded\(\)' /tmp/cheems-native-api.txt
          grep -Eq 'tunnelConnections\(\)' /tmp/cheems-native-api.txt
          grep -Eq 'tunnelDNSQueries\(\)' /tmp/cheems-native-api.txt
          grep -Eq 'tunnelLastError\(\)' /tmp/cheems-native-api.txt
          grep -Eq 'startTunnel\(long\)' /tmp/cheems-native-api.txt
      - name: Compile and lint Android sources (no APK packaging)
        run: |
          mkdir -p app/libs
          cp native/quic/cheems-quic.aar app/libs/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          if 'files("libs/cheems-quic.aar")' not in s:
              s = s.replace('dependencies {', 'dependencies {\n implementation files("libs/cheems-quic.aar")', 1)
              p.write_text(s)
          PY
          gradle :app:testDebugUnitTest :app:compileDebugJavaWithJavac :app:lintDebug --stacktrace
